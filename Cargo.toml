[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/backtest",
    "crates/backtest-api",
    "crates/market-data",
    "crates/market-data-api",
    "crates/data-preprocess",
    "crates/symbols",
    "crates/backtest-server",
    "crates/service",
    "crates/service-xrpc",
    "crates/signal-parser",
]

[workspace.package]
version = "0.2.6"
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/geminik23/quant-system"
readme = "README.md"

[workspace.dependencies]
criterion = "0.5"

# Workspace crates
qs-core = { package = "quant-system-core", path = "crates/core", version = "0.2.6" }
qs-backtest = { path = "crates/backtest", version = "0.2.6" }
qs-backtest-api = { path = "crates/backtest-api", version = "0.2.6" }
qs-data-preprocess = { path = "crates/data-preprocess", version = "0.2.6", default-features = false }
qs-market-data-api = { path = "crates/market-data-api", version = "0.2.6" }
qs-service = { path = "crates/service", version = "0.2.6" }
qs-service-xrpc = { path = "crates/service-xrpc", version = "0.2.6" }
qs-symbols = { path = "crates/symbols", version = "0.2.6" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
toml = "0.8"

# CLI & config
clap = { version = "4.5", features = ["derive", "env"] }
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "2.0"

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
nanoid = "0.4"

# IPC / RPC
xrpc-rs = "0.3.1"

# Data storage & parsing
duckdb = { version = "1.2", features = ["bundled"] }
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1.3"
regex = "1"
polars = { version = "0.46", features = ["parquet", "lazy", "dtype-datetime"] }

# HTTP framework (optional, used by online signal server)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# CTrader FIX protocol
ctrader-fix = "0.5"

# TUI (optional, used by tui-client feature)
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
