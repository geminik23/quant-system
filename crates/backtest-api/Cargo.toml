[package]
name = "qs-backtest-api"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Provider-neutral request, response, event, and client contracts for the quant-system backtest service"
keywords = ["backtest", "api", "service", "trading"]
categories = ["finance"]

[features]
default = []
xrpc = ["dep:qs-service-xrpc"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
qs-service = { workspace = true }
qs-service-xrpc = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
xrpc-rs = { workspace = true }
