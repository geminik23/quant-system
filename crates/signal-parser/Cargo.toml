[package]
name = "qs-signal-parser"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Source-event and stateless signal-normalization contracts with Telegram compatibility parsing"
keywords = ["telegram", "parser", "signals", "trading"]

[lib]
name = "signal_parser"

[[bin]]
name = "parse_signals"
path = "src/bin/parse_signals.rs"

[features]
default = ["offline"]
offline = []
online = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio"]

[dependencies]
qs-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
regex = { workspace = true }

# Online-only (feature-gated)
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
