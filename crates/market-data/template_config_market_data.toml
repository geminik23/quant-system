# Market Data Service Configuration

[ctrader]
# cTrader FIX connection settings
sendercompid = "demo.ctrader.12345"
server = "demo.ctrader.com"
username = "12345"
password = "your_password"
# Parsed for compatibility; current workspace code does not select connector behavior from this value.
ssl = false

# Reconnection retry settings (optional — defaults shown below)
# retry_max_attempts = 0       # 0 = infinite retries
# retry_base_delay_secs = 2    # initial backoff delay in seconds
# retry_max_delay_secs = 60    # maximum backoff cap in seconds

# Market Data Service endpoint and transport limits
[market_data]
endpoint = "shm://market-data"
shm_buffer_size = 4194304
max_connections = 256
# Required only for unauthenticated non-loopback TCP on a trusted network.
allow_insecure_non_loopback = false

# Logging configuration
[logging]
level = "info"
