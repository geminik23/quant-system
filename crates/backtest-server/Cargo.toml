[package]
name = "qs-backtest-server"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-neutral retained-job backtest service and CLI"
keywords = ["backtest", "server", "ipc", "trading"]
categories = ["finance"]

[lib]
name = "backtest_server"

[[bin]]
name = "backtest_server"
path = "src/bin/backtest_server.rs"

[[bin]]
name = "tg_backtest"
path = "src/bin/tg_backtest.rs"

[dependencies]
qs-core = { workspace = true }
qs-backtest = { workspace = true }
qs-backtest-api = { workspace = true }
qs-data-preprocess = { workspace = true, features = ["parquet"] }
qs-service = { workspace = true }
qs-service-xrpc = { workspace = true }
qs-symbols = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }
xrpc-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
nanoid = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
